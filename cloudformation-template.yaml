AWSTemplateFormatVersion: '2010-09-09'
Description: 'S3 Static Website with CloudFront Distribution for React SPA'

Parameters:
  BucketName:
    Type: String
    Description: 'Name for the S3 bucket (leave empty to auto-generate)'
    Default: ''
  S3Region:
    Type: String
    Description: 'AWS Region for S3 bucket'
    Default: 'us-east-2'
    AllowedValues:
      - us-east-1
      - us-east-2
      - us-west-1
      - us-west-2
      - eu-west-1
      - eu-central-1
      - ap-southeast-1
      - ap-northeast-1
  BucketPrefix:
    Type: String
    Description: 'S3 prefix/folder path (optional, with trailing slash)'
    Default: ''
  UseExistingBucket:
    Type: String
    Description: 'Whether to use an existing bucket'
    Default: 'false'
    AllowedValues:
      - 'true'
      - 'false'
  DomainName:
    Type: String
    Description: 'Custom domain name (optional)'
    Default: ''
  SSLCertificateArn:
    Type: String
    Description: 'SSL Certificate ARN for custom domain (required if domain specified)'
    Default: ''

Conditions:
  HasCustomDomain: !Not [!Equals [!Ref DomainName, '']]
  HasSSLCertificate: !Not [!Equals [!Ref SSLCertificateArn, '']]
  AutoGenerateBucketName: !Equals [!Ref BucketName, '']
  CreateNewBucket: !Equals [!Ref UseExistingBucket, 'false']
  HasBucketPrefix: !Not [!Equals [!Ref BucketPrefix, '']]

Resources:
  # S3 Bucket for static website hosting (only created if not using existing)
  S3Bucket:
    Type: AWS::S3::Bucket
    Condition: CreateNewBucket
    Properties:
      BucketName: !If 
        - AutoGenerateBucketName
        - !Sub '${AWS::StackName}-${AWS::AccountId}-${AWS::Region}'
        - !Ref BucketName
      WebsiteConfiguration:
        IndexDocument: index.html
        ErrorDocument: index.html
      PublicAccessBlockConfiguration:
        BlockPublicAcls: false
        BlockPublicPolicy: false
        IgnorePublicAcls: false
        RestrictPublicBuckets: false
      CorsConfiguration:
        CorsRules:
          - AllowedHeaders: ['*']
            AllowedMethods: [GET, HEAD]
            AllowedOrigins: ['*']
            MaxAge: 3600

  # S3 Bucket Policy for CloudFront OAC access
  S3BucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !If
        - CreateNewBucket
        - !Ref S3Bucket
        - !Ref BucketName
      PolicyDocument:
        Statement:
          - Sid: AllowCloudFrontServicePrincipal
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !If
              - HasBucketPrefix
              - !Sub
                - 'arn:aws:s3:::${BucketName}/${BucketPrefix}/*'
                - BucketName: !If [CreateNewBucket, !Ref S3Bucket, !Ref BucketName]
              - !Sub
                - 'arn:aws:s3:::${BucketName}/*'
                - BucketName: !If [CreateNewBucket, !Ref S3Bucket, !Ref BucketName]
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub 'arn:aws:cloudfront::${AWS::AccountId}:distribution/${CloudFrontDistribution}'

  # CloudFront Origin Access Control
  OriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub '${AWS::StackName}-OAC'
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  # CloudFront Distribution
  CloudFrontDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Aliases: !If
          - HasCustomDomain
          - [!Ref DomainName]
          - !Ref AWS::NoValue
        ViewerCertificate: !If
          - HasCustomDomain
          - AcmCertificateArn: !Ref SSLCertificateArn
            SslSupportMethod: sni-only
            MinimumProtocolVersion: TLSv1.2_2021
          - CloudFrontDefaultCertificate: true
        Origins:
          - Id: S3Origin
            DomainName: !If
              - CreateNewBucket
              - !GetAtt S3Bucket.RegionalDomainName
              - !Sub '${BucketName}.s3.${S3Region}.amazonaws.com'
            OriginPath: !If
              - HasBucketPrefix
              - !Sub '/${BucketPrefix}'
              - !Ref 'AWS::NoValue'
            S3OriginConfig:
              OriginAccessIdentity: ''
            OriginAccessControlId: !Ref OriginAccessControl
        DefaultCacheBehavior:
          TargetOriginId: S3Origin
          ViewerProtocolPolicy: redirect-to-https
          CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad  # CachingDisabled
          OriginRequestPolicyId: 88a5eaf4-2fd4-4709-b370-b4c650ea3fcf  # CORS-S3Origin
          ResponseHeadersPolicyId: 67f7725c-6f97-4210-82d7-5512b31e9d03  # SecurityHeadersPolicy
          Compress: true
          # SPA routing handled by CustomErrorResponses below
        CacheBehaviors:
          # Cache static assets with long TTL
          - PathPattern: '*.js'
            TargetOriginId: S3Origin
            ViewerProtocolPolicy: redirect-to-https
            CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6  # CachingOptimized
            OriginRequestPolicyId: 88a5eaf4-2fd4-4709-b370-b4c650ea3fcf  # CORS-S3Origin
            Compress: true
          - PathPattern: '*.css'
            TargetOriginId: S3Origin
            ViewerProtocolPolicy: redirect-to-https
            CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6  # CachingOptimized
            OriginRequestPolicyId: 88a5eaf4-2fd4-4709-b370-b4c650ea3fcf  # CORS-S3Origin
            Compress: true
          - PathPattern: '/assets/*'
            TargetOriginId: S3Origin
            ViewerProtocolPolicy: redirect-to-https
            CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6  # CachingOptimized
            OriginRequestPolicyId: 88a5eaf4-2fd4-4709-b370-b4c650ea3fcf  # CORS-S3Origin
            Compress: true
        CustomErrorResponses:
          - ErrorCode: 404
            ResponseCode: 200
            ResponsePagePath: '/index.html'
            ErrorCachingMinTTL: 0
          - ErrorCode: 403
            ResponseCode: 200
            ResponsePagePath: '/index.html'
            ErrorCachingMinTTL: 0
        Enabled: true
        DefaultRootObject: 'index.html'
        PriceClass: PriceClass_100  # Use only North America and Europe edge locations
        HttpVersion: http2

  # SPA routing handled by CustomErrorResponses (404/403 -> index.html)

Outputs:
  BucketName:
    Description: 'S3 Bucket name'
    Value: !If
      - CreateNewBucket
      - !Ref S3Bucket
      - !Ref BucketName
    Export:
      Name: !Sub '${AWS::StackName}-BucketName'

  BucketWebsiteURL:
    Description: 'S3 Static website URL'
    Value: !If
      - CreateNewBucket
      - !GetAtt S3Bucket.WebsiteURL
      - !Sub 'http://${BucketName}.s3-website.${S3Region}.amazonaws.com'
    Export:
      Name: !Sub '${AWS::StackName}-BucketWebsiteURL'

  DistributionId:
    Description: 'CloudFront Distribution ID'
    Value: !Ref CloudFrontDistribution
    Export:
      Name: !Sub '${AWS::StackName}-DistributionId'

  DistributionDomainName:
    Description: 'CloudFront Distribution Domain Name'
    Value: !GetAtt CloudFrontDistribution.DomainName
    Export:
      Name: !Sub '${AWS::StackName}-DistributionDomain'

  WebsiteURL:
    Description: 'Full website URL'
    Value: !If
      - HasCustomDomain
      - !Sub 'https://${DomainName}'
      - !Sub 'https://${CloudFrontDistribution.DomainName}'
    Export:
      Name: !Sub '${AWS::StackName}-WebsiteURL'