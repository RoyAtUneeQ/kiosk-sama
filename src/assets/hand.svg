<svg xmlns="http://www.w3.org/2000/svg" version="1.1" width="512.000000pt" height="512.000000pt" viewBox="0 0 512.000000 512.000000" preserveAspectRatio="xMidYMid meet">
  <defs>
    <!-- Gradiente principal com cor base E20074 -->
    <linearGradient id="mainGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#E20074;stop-opacity:0.1" />
      <stop offset="100%" style="stop-color:#EB4634;stop-opacity:1" />
    </linearGradient>

    <linearGradient id="mainGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0" style="stop-color:#D968D0;stop-opacity:0.1" ></stop>
      <stop offset="1" style="stop-color:#EB4634;stop-opacity:1"></stop>
    </linearGradient>

    <!-- Gradiente para sombra com tons complementares -->
    <linearGradient id="shadowGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFB3D1;stop-opacity:0.4" />
      <stop offset="100%" style="stop-color:#2A0115;stop-opacity:0.7" />
    </linearGradient>
    
    <!-- Gradiente para highlight com tons rosados -->
    <linearGradient id="highlightGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#E20074;stop-opacity:0.4" />
      <stop offset="50%" style="stop-color:#FFB3D1;stop-opacity:0.2" />
      <stop offset="100%" style="stop-color:#E20074;stop-opacity:0.1" />
    </linearGradient>
    
    <!-- Padrão de textura -->
    <pattern id="noiseTexture" x="0" y="0" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="4" fill="url(#mainGradient)"/>
      <circle cx="1" cy="1" r="0.5" fill="#E20074" opacity="0.1"/>
      <circle cx="3" cy="3" r="0.3" fill="#000000" opacity="0.05"/>
      <rect x="0" y="2" width="4" height="0.5" fill="#ffffff" opacity="0.03"/>
    </pattern>
    
    <!-- Filtro para sombra projetada com cor harmônica -->
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="8"/>
      <feOffset dx="8" dy="12" result="offset"/>
      <feFlood flood-color="#4A0225" flood-opacity="0.5"/>
      <feComposite in2="offset" operator="in"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <!-- Filtro para brilho interno -->
    <filter id="innerGlow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <!-- Filtro para textura rugosa -->
    <filter id="roughTexture">
      <feTurbulence baseFrequency="0.9" numOctaves="4" result="noise" seed="2"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="3"/>
    </filter>
  </defs>

  <!-- Sombra de fundo -->
  <g transform="translate(512.000000, 0.000000) scale(-1.000000, 1.000000) translate(0.000000,512.000000) scale(0.100000,-0.100000)">
    <path fill="url(#shadowGradient)" opacity="0.3" transform="translate(80, 100)" d="M2347 4855 c-61 -15 -116 -59 -144 -115 l-23 -44 0 -968 0 -968 -55 0 -54 0 -3 828 -3 828 -25 49 c-49 95 -155 141 -268 115 -73 -16 -143 -83 -160 -152 -9 -34 -12 -270 -12 -857 l0 -811 -45 0 -44 0 -3 618 -3 619 -30 48 c-61 97 -188 136 -295 88 -47 -21 -105 -78 -121 -120 -13 -34 -12 -2681 1 -2814 47 -473 202 -724 528 -853 163 -65 260 -80 547 -80 200 -1 269 3 345 17 164 31 325 94 450 176 74 48 220 190 279 270 50 69 863 1448 887 1507 19 45 18 118 -2 160 -24 51 -105 119 -159 134 -59 17 -146 7 -190 -20 -19 -12 -137 -132 -263 -267 l-227 -245 -5 1119 -5 1118 -23 47 c-46 92 -158 143 -261 118 -66 -15 -125 -59 -153 -112 l-23 -43 -3 -742 -2 -743 -70 0 -70 0 0 956 c0 688 -3 967 -11 995 -33 109 -161 175 -282 144z"/>
  </g>

  <!-- Mão principal com textura -->
  <g transform="translate(512.000000, 0.000000) scale(-1.000000, 1.000000) translate(0.000000,512.000000) scale(0.100000,-0.100000)">
    <path fill="url(#noiseTexture)" filter="url(#dropShadow)" d="M2347 4855 c-61 -15 -116 -59 -144 -115 l-23 -44 0 -968 0 -968 -55 0 -54 0 -3 828 -3 828 -25 49 c-49 95 -155 141 -268 115 -73 -16 -143 -83 -160 -152 -9 -34 -12 -270 -12 -857 l0 -811 -45 0 -44 0 -3 618 -3 619 -30 48 c-61 97 -188 136 -295 88 -47 -21 -105 -78 -121 -120 -13 -34 -12 -2681 1 -2814 47 -473 202 -724 528 -853 163 -65 260 -80 547 -80 200 -1 269 3 345 17 164 31 325 94 450 176 74 48 220 190 279 270 50 69 863 1448 887 1507 19 45 18 118 -2 160 -24 51 -105 119 -159 134 -59 17 -146 7 -190 -20 -19 -12 -137 -132 -263 -267 l-227 -245 -5 1119 -5 1118 -23 47 c-46 92 -158 143 -261 118 -66 -15 -125 -59 -153 -112 l-23 -43 -3 -742 -2 -743 -70 0 -70 0 0 956 c0 688 -3 967 -11 995 -33 109 -161 175 -282 144z">
      
      <!-- Animação sutil de pulsação -->
      <animateTransform
        attributeName="transform"
        attributeType="XML"
        type="scale"
        values="1;1.02;1"
        dur="3s"
        repeatCount="indefinite"/>
    </path>
  </g>

  <!-- Camada de highlight -->
  <g transform="translate(512.000000, 0.000000) scale(-1.000000, 1.000000) translate(0.000000,512.000000) scale(0.100000,-0.100000)">
    <path fill="url(#highlightGradient)" filter="url(#innerGlow)" d="M2347 4855 c-61 -15 -116 -59 -144 -115 l-23 -44 0 -968 0 -968 -55 0 -54 0 -3 828 -3 828 -25 49 c-49 95 -155 141 -268 115 -73 -16 -143 -83 -160 -152 -9 -34 -12 -270 -12 -857 l0 -811 -45 0 -44 0 -3 618 -3 619 -30 48 c-61 97 -188 136 -295 88 -47 -21 -105 -78 -121 -120 -13 -34 -12 -2681 1 -2814 47 -473 202 -724 528 -853 163 -65 260 -80 547 -80 200 -1 269 3 345 17 164 31 325 94 450 176 74 48 220 190 279 270 50 69 863 1448 887 1507 19 45 18 118 -2 160 -24 51 -105 119 -159 134 -59 17 -146 7 -190 -20 -19 -12 -137 -132 -263 -267 l-227 -245 -5 1119 -5 1118 -23 47 c-46 92 -158 143 -261 118 -66 -15 -125 -59 -153 -112 l-23 -43 -3 -742 -2 -743 -70 0 -70 0 0 956 c0 688 -3 967 -11 995 -33 109 -161 175 -282 144z"/>
  </g>

</svg>