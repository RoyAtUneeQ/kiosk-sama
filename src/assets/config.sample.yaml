# State Manager - Persistent session state accessible across applications
stateManager:
  workspaceId: "YOUR_WORKSPACE_ID"
  endpoint: "http://localhost:3000"  # or production URL
  apiKey: "YOUR_STATE_MANAGER_API_KEY"
  enabled: true  # Set to false to disable state manager